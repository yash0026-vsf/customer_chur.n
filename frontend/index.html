<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Customer Churn Predictor</h1>
        <p>Enter customer details below to predict whether they are at risk of leaving.</p>
        
        <form id="prediction-form">
            <div class="form-group">
                <label for="age">Customer Age:</label>
                <input type="number" id="age" name="age" required min="18" max="120" placeholder="e.g., 28">
            </div>
            
            <div class="form-group">
                <label for="monthly_charges">Monthly Charges ($):</label>
                <input type="number" id="monthly_charges" name="monthly_charges" required min="0" step="0.01" placeholder="e.g., 65.50">
            </div>
            
            <button type="submit" id="submit-btn">Predict Churn</button>
        </form>

        <div id="result-container" class="hidden">
            <h2 id="result-text"></h2>
        </div>
        
        <div id="error-container" class="hidden">
            <p id="error-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
